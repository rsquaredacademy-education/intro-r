[build]
  publish = "docs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 10 Legacy Bookdown chapter redirects (relative paths ensure portability across domains & Netlify deploy previews)
[[redirects]]
  from = "/intro.html"
  to = "/introduction-to-r.html"
  status = 301
  force = true

[[redirects]]
  from = "/install.html"
  to = "/install-r-and-rstudio.html"
  status = 301
  force = true

[[redirects]]
