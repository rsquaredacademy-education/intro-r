project:
  type: book
  output-dir: docs
  resources:
    - "robots.txt"
    - "google02e424888b5e2def.html"
    - "404.html"
    - "img/og-card.png"
    - "img/*.webp"
    - "data-webr/*.csv"

quarto-required: ">=1.6.0"
sitemap: true

book:
  title: "Introduction to R"
  author: "Aravind Hebbali"
  date: last-modified
  description: "A beginner-friendly introduction to the R programming language."
  chapters:
    - index.qmd
    - about-the-author.qmd
    - introduction-to-r.qmd
    - install-r-and-rstudio.qmd
    - variables-in-r.qmd
    - data-types-in-r.qmd
    - getting-help-in-r.qmd
    - vectors-in-r.qmd
    - data-frames-in-r.qmd
    - factors-in-r.qmd
    - lists-in-r.qmd
    - install-update-r-packages.qmd
    - projects-import.qmd
    - first-plot.qmd
    - first-wrangle.qmd
  downloads: [pdf, epub]

website:
  site-url: https://intro-r.rsquaredacademy.com
  description: "A beginner-friendly introduction to the R programming language."
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/rsquaredacademy-publications/intro-r/
  navbar:
    right:
      - text: "GitHub"
        href: https://github.com/rsquaredacademy-publications/intro-r/

execute:
  warning: false

format:
  html:
    # Interactive R cells via WebAssembly (WebR). Scoped to HTML only:
    # the webr Lua filter rewrites the AST and breaks the Typst
    # template's callout definitions for PDF/ePub output.
    filters:
      - webr
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    search: true
    code-copy: true
    code-overflow: wrap
    include-in-header:
      - _ga_partial.html
      - meta-og.html
    include-after-body: footer.html
  pdf:
    documentclass: scrreprt
    papersize: us-letter
    pdf-engine: typst
    keep-typ: false
    code-overflow: wrap
    fig-format: png
    mainfont: "Linux Libertine"
    monofont: "DejaVu Sans Mono"
    toc: true
    number-sections: true
  epub:
    toc-depth: 2
    code-overflow: wrap

language:
  search:
    placeholder: "Search"
