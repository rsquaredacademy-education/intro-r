name: CI

on:
  push:
    branches: [master, "spike/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"

      - uses: typst-community/setup-typst@v4

      - name: Install fonts and zip tools
        run: sudo apt-get update && sudo apt-get install -y
          fonts-linuxlibertine fonts-dejavu-core zip unzip

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            knitr
            readr
            readxl
            here
            ggplot2
            dplyr

      - name: webR smoke test
        run: Rscript scripts/webr-smoke.R

      - name: Render book
        run: quarto render

      - name: Sitemap
        run: bash scripts/make-sitemap.sh docs https://intro-r.rsquaredacademy.com

      - name: Gate 1 - no unresolved cross-references
        run: |
          if grep -r '??</strong>' docs/*.html; then
            echo 'FAIL: unresolved ?? references found'; exit 1
          fi
          echo 'OK: no ?? in published HTML'

      - name: Gate 2 - redirect targets exist
        run: |
          missing=0
          for dest in introduction-to-r about-the-author install-r-and-rstudio \
            variables-in-r data-types-in-r getting-help-in-r vectors-in-r \
            data-frames-in-r factors-in-r lists-in-r install-update-r-packages \
            projects-import first-plot first-wrangle index; do
            if [ ! -f "docs/${dest}.html" ]; then echo "MISSING: docs/${dest}.html"; missing=1; fi
          done
          # legacy slugs must not exist as stale files shadowing Netlify 301s
          for stale in installation references; do
            if [ -f "docs/${stale}.html" ]; then echo "STALE: docs/${stale}.html"; missing=1; fi
          done
          exit $missing

      - name: Gate 3 - redirect targets resolve
        run: bash scripts/test-redirects.sh docs

      - name: Gate 4 - sitemap covers every page
        run: |
          pages=$(ls docs/*.html | grep -v 404.html | grep -v 'google.*\.html' | wc -l)
          urls=$(grep -c '<url>' docs/sitemap.xml)
          if [ "$pages" -ne "$urls" ]; then
            echo "FAIL: $pages pages but $urls sitemap URLs"; exit 1
          fi
          echo "OK: $urls pages in sitemap"

      - name: Gate 5 - link check (advisory)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --exclude-mail --max-concurrency 8 --exclude 'site_libs/' 'docs/**/*.html'
          fail: false

      # Mobile perf budget. Advisory only, and deliberately so: GitHub's shared
      # runners throttle harder than a workstation. The image-free control page
      # factors-in-r.html measured LCP 3936ms locally but 10424ms on the runner,
      # so the two environments are not comparable and the budgets are not yet
      # trustworthy as gates. Flip continue-on-error once runner medians are
      # recalibrated into scripts/perf-audit.mjs.
      #
      # Serve with `npx serve`, not `python3 -m http.server`: the latter sends no
      # Content-Encoding, so transferSize came back as 1688KB uncompressed
      # against 502KB locally and the weight budget could never pass. The server
      # must match the one used for local runs or the weight number is fiction.
      - name: Mobile performance budget (advisory)
        continue-on-error: true
        run: |
          npx --yes serve docs -l 4321 >/dev/null 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4321/ && break
            sleep 1
          done
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            export CHROME_PATH="$chrome"
            echo "Using Chrome at $CHROME_PATH"
          else
            echo "No Chrome binary found; Lighthouse will fall back to its own lookup"
          fi
          node scripts/perf-audit.mjs --base http://localhost:4321 \
            --page index.html --page factors-in-r.html --class static --runs 3

      # Keeps docs/ in step with the .qmd sources. Without this, the site only
      # changes when a human remembers to commit a local render. Safe from
      # feedback loops: pushes made with GITHUB_TOKEN do not trigger further
      # workflow runs, even though PDF/ePub differ on every build.
      - name: Commit docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: rebuild site via ci"
          file_pattern: docs/
