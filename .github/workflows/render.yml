name: CI

on:
  push:
    branches: [master, "spike/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"

      # Pin Typst as well as Quarto, and bump them together — never one alone.
      # Quarto 1.7+ ships a Typst template that Typst 0.11 cannot compile.
      - uses: typst-community/setup-typst@v4
        with:
          version: "0.11.0"

      # Typst ships no fonts and the bare runner has none either, so a stale
      # fontconfig cache fails the PDF with "font fallback list must not be
      # empty". fc-cache -f makes the resolver see what we just installed.
      - name: Install fonts and zip tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-linuxlibertine fonts-dejavu-core zip unzip
          fc-cache -f

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            knitr
            readr
            readxl
            here
            ggplot2
            dplyr

      - name: webR smoke test
        run: Rscript scripts/webr-smoke.R

      - name: Render book
        run: quarto render

      # downloads: [pdf, epub] is advertised on the landing page; assert the
      # artifacts really shipped rather than trusting the assemble step.
      - name: Verify downloads are present
        run: |
          ls docs/*.pdf || { echo "PDF MISSING"; exit 1; }
          ls docs/*.epub || { echo "EPUB MISSING"; exit 1; }

      - name: Sitemap
        run: bash scripts/make-sitemap.sh docs https://intro-r.rsquaredacademy.com

      - name: Gate 1 - no unresolved cross-references
        run: |
          if grep -r '??</strong>' docs/*.html; then
            echo 'FAIL: unresolved ?? references found'; exit 1
          fi
          echo 'OK: no ?? in published HTML'

      # Replaces the hand-maintained slug list this book carried. The list was
      # accurate when written and had to be updated by hand on every new chapter.
      - name: Gate 2 - slugs rendered
        run: sh scripts/verify-slugs.sh docs

      # legacy slugs must not exist as stale files shadowing Netlify 301s
      - name: Gate 3 - no stale legacy slugs
        run: |
          stale_found=0
          for stale in installation references; do
            if [ -f "docs/${stale}.html" ]; then
              echo "STALE: docs/${stale}.html shadows a Netlify 301"; stale_found=1
            fi
          done
          exit $stale_found

      - name: Gate 4 - redirect targets resolve
        run: bash scripts/test-redirects.sh docs

      # Set comparison, not a count. The old count check passed even with a page
      # missing, because a bare "/" root entry offset it.
      - name: Gate 5 - sitemap covers every page
        run: sh scripts/verify-sitemap.sh docs docs/sitemap.xml

      - name: Gate 6 - link check (advisory)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --exclude-mail --max-concurrency 8 --exclude 'site_libs/' 'docs/**/*.html'
          fail: false

      # Keeps docs/ in step with the .qmd sources. Without this, the site only
      # changes when a human remembers to commit a local render. Safe from
      # feedback loops: pushes made with GITHUB_TOKEN do not trigger further
      # workflow runs, even though PDF/ePub differ on every build.
      - name: Commit docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: rebuild site via ci"
          file_pattern: docs/
